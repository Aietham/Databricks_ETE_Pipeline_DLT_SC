resources:
  jobs:
    Initial_setup:
      name: Initial_setup
      tasks:
        - task_key: Catalog_external_locations_Setup
          notebook_task:
            notebook_path: ../../src/Initial_setup/Creating-Catalogs,Credentials,Locations,Volumes,Schemas.ipynb
            source: WORKSPACE
          existing_cluster_id: 1121-211717-lx4xofcj
        - task_key: Schema_parameters
          depends_on:
            - task_key: Catalog_external_locations_Setup
          notebook_task:
            notebook_path: ../../src/Initial_setup/Parameters_layers.ipynb
            source: WORKSPACE
          existing_cluster_id: 1121-211717-lx4xofcj
        - task_key: Creating_schemas_iteration
          depends_on:
            - task_key: Schema_parameters
          for_each_task:
            inputs: "{{tasks.Schema_parameters.values.output_layers}}"
            task:
              task_key: Creating_schemas_iteration_iteration
              notebook_task:
                notebook_path: ../../src/Initial_setup/Creating_layers.ipynb
                base_parameters:
                  layer_name: "{{input.layer}}"
                source: WORKSPACE
              existing_cluster_id: 1121-211717-lx4xofcj
        - task_key: Creating_checkpoints
          depends_on:
            - task_key: Creating_schemas_iteration
          notebook_task:
            notebook_path: ../../src/Initial_setup/Creating_checkpoints.ipynb
            source: WORKSPACE
          existing_cluster_id: 1121-211717-lx4xofcj
        - task_key: Dimensions_parameter
          depends_on:
            - task_key: Creating_schemas_iteration
          notebook_task:
            notebook_path: ../../src/Initial_setup/Parameters_filenames.ipynb
            source: WORKSPACE
          existing_cluster_id: 1121-211717-lx4xofcj
        - task_key: Creating_volumes_over_Dimensions_iteration
          depends_on:
            - task_key: Dimensions_parameter
          for_each_task:
            inputs: "{{tasks.Dimensions_parameter.values.output_datasets}}"
            task:
              task_key: Creating_volumes_over_Dimensions_iteration_iteration
              notebook_task:
                notebook_path: ../../src/Initial_setup/Creating_source_volumes.ipynb
                base_parameters:
                  file_name: "{{input.filename}}"
                source: WORKSPACE
              existing_cluster_id: 1121-211717-lx4xofcj
      queue:
        enabled: true
