# This is a Databricks asset bundle definition for databricks_dlt_pyspark.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_dlt_pyspark
  uuid: 5e0bb45e-5c5d-4925-895f-509946a61624

include:
  - resources/*.yml
  - resources/*/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-3978404737198330.10.azuredatabricks.net:443
    variables:
      catalog: scds
      schema: dev
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-3978404737198330.10.azuredatabricks.net:443
      # We explicitly deploy to /Workspace/Users/chhatrn@ad.clarkson.edu to make sure we only have a single copy.
      root_path: /Workspace/Users/chhatrn@ad.clarkson.edu/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: scds
      schema: prod
    permissions:
      - user_name: chhatrn@ad.clarkson.edu
        level: CAN_MANAGE
